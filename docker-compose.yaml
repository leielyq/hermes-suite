# =============================================================================
# Hermes Suite — docker-compose.yaml
#
# Single-container setup: all services in one image.
# No UID/GID sharing issues — everything runs as the same user.
#
# Usage:
#   podman-compose up -d
#   podman-compose logs -f
#   podman-compose down
#
# For Docker, replace podman-compose with docker compose.
# =============================================================================

services:
  hermes-suite:
    build:
      context: .
      dockerfile: Dockerfile
    image: leiel/hermes-suite:${HERMES_SUITE_IMAGE_TAG}
    container_name: hermes-suite
    networks:
      agent_net:
        ipv4_address: 10.99.0.11
    ports:
      # Gateway (CLI, Telegram, webhook)
      - "8642:8642"
      # Dashboard (monitoring/analytics)
      - "9119:9119"
    volumes:
      # Persist config, sessions, skills, memory across restarts
      - ~/.hermes:/opt/data:Z
      # Workspace directory — change to your project directory
      - ~/workspace:/workspace:z
      # Custom supervisord services (one [program:x] block per *.conf file).
      # Survives container recreation and image updates — see README.
      - ./supervisor.d:/etc/supervisor/conf.d:ro,Z
      # Clock sync
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - HERMES_HOME=/opt/data
      - HERMES_DATA_DIR=/opt/data
      - DASHBOARD_CREDENTIAL=${DASHBOARD_CREDENTIAL:-admin:admin}
      - PATH=/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  agent_net:
    external: true
